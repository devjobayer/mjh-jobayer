<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Coaching Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding-bottom: 70px; } /* Space for bottom nav */
        .student-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem 3rem;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: -2rem;
        }
        .info-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            background: white;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <div class="student-header">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0 fw-bold">My Portal</h4>
            <a href="index.html" class="text-white"><i class="bi bi-box-arrow-right fs-4"></i></a>
        </div>
        <div class="d-flex align-items-center">
            <div class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
                <i class="bi bi-person-fill fs-3"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-bold" id="stu-name">Loading...</h5>
                <p class="mb-0 small opacity-75" id="stu-detail">Class - | ID: -</p>
            </div>
        </div>
    </div>

    <div class="container px-3">
        <!-- Status Card -->
        <div class="card info-card">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <p class="text-muted small mb-1">Payment Status (Oct)</p>
                    <h5 class="fw-bold text-success mb-0"><i class="bi bi-check-circle-fill me-1"></i> Paid</h5>
                </div>
                <div class="text-end">
                    <p class="text-muted small mb-1">Attendance</p>
                    <h5 class="fw-bold mb-0">95%</h5>
                </div>
            </div>
        </div>

        <!-- Next Class -->
        <div class="card info-card">
            <h6 class="fw-bold mb-3"><i class="bi bi-clock me-2 text-primary"></i>Next Class</h6>
            <div class="p-3 bg-light rounded-3 border-start border-4 border-primary">
                <h5 class="mb-1">Physics</h5>
                <p class="mb-1 text-muted small">Chapter 5: Motion</p>
                <div class="d-flex align-items-center text-muted small">
                    <i class="bi bi-alarm me-1"></i> 10:00 AM - 11:30 AM
                </div>
            </div>
        </div>

        <!-- Recent Payments -->
        <h6 class="fw-bold px-1 mb-3">Payment History</h6>
        <div class="card info-card p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-borderless align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th class="ps-4">Month</th>
                            <th>Date</th>
                            <th class="text-end pe-4">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="stu-payment-history">
                        <!-- Dynamic -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="navbar navbar-light bg-white fixed-bottom shadow-lg border-top">
        <div class="container-fluid justify-content-around">
            <a href="#" class="nav-link text-center active text-primary">
                <i class="bi bi-house-door-fill fs-4 d-block"></i>
                <span class="small" style="font-size: 10px;">Home</span>
            </a>
            <a href="#" class="nav-link text-center text-muted">
                <i class="bi bi-calendar-event fs-4 d-block"></i>
                <span class="small" style="font-size: 10px;">Routine</span>
            </a>
            <a href="#" class="nav-link text-center text-muted">
                <i class="bi bi-chat-dots fs-4 d-block"></i>
                <span class="small" style="font-size: 10px;">Notice</span>
            </a>
            <a href="#" class="nav-link text-center text-muted">
                <i class="bi bi-person fs-4 d-block"></i>
                <span class="small" style="font-size: 10px;">Profile</span>
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
