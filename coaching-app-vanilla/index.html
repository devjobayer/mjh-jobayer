<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coaching Pro SaaS</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            background: #fff;
            padding: 2rem 2rem 1rem;
            text-align: center;
        }
        .login-body {
            background: #fff;
            padding: 1rem 2rem 2rem;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        .btn-login {
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
        }
        .btn-login:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-header">
            <div class="mb-3 text-primary">
                <i class="bi bi-mortarboard-fill" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold text-dark">Coaching Pro SaaS</h4>
            <p class="text-muted small">Sign in to your account</p>
        </div>
        <div class="login-body">
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small text-muted">Role</label>
                    <select class="form-select" id="login-role">
                        <option value="super-admin">Super Admin</option>
                        <option value="teacher">Teacher (Admin)</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Email Address</label>
                    <input type="email" class="form-control" id="login-email" placeholder="name@example.com" value="demo@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter password" value="123456" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-login text-white">Login</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="#" class="small text-decoration-none text-muted">Forgot password?</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>
</body>
</html>
